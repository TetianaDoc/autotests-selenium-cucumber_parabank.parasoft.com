name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, SonarLint & Headless UI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run SonarLint and Tests (Headless Firefox)
        run: ./gradlew test sonarlintMain sonarlintTest -Dqa.browser=FIREFOX -Dqa.env=PROD -Dqa.headless=true

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-reports
          path: '**/build/reports/tests/test/'
